<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pattern Cube</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #ffffff; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<script>
/* =========================================================================
   Tunable constants
   ========================================================================= */
const PHASE_PAUSE    = 2500;   // still time between the end of one turn and the next
const TURN_MS        = 1200;   // duration of one 90° layer turn / hex turn
const WAVE_STAGGER   = 200;    // delay between layers in the wave phase
// Degrees each hexagon ring turns in phase 6. Must be a multiple of 120:
// anything else (e.g. 60) leaves the cube upside down, i.e. no longer viewed
// from its top corner, and later layer turns would look illegal.
const HEX_ANGLE      = 120;

const SHAPE_SIZE   = 0.50;     // shape width as a fraction of its grid cell
const TRI_SIZE     = 0.62;     // triangles drawn a bit bigger
const DOT_SIZE     = 0.30;     // inner-face dots
const HOLE         = 0.30;     // hole diameter as a fraction of shape width
const CORNER       = 0.22;     // square corner radius as a fraction of width
const INNER_COLOR  = "#c9ccd3";// color of the dots on exposed inner faces
const SKEW         = 18;       // max hue shift (deg) across a tile end-to-end

/* =========================================================================
   Colors / shapes generation (same logic and seeds as the static version)
   ========================================================================= */
const COLORS = [
  { name: "red",    h: 0   },
  { name: "orange", h: 26  },
  { name: "yellow", h: 50  },
  { name: "green",  h: 135 },
  { name: "blue",   h: 215 },
  { name: "purple", h: 278 },
];
const SHAPES = ["circle", "square", "triangle", "ring", "hollow"];
const FACES  = ["front", "back", "right", "left", "top", "bottom"];
const GRID   = 7;   // shapes per tile side
const TILES  = 3;   // tiles per face side

// Seeded PRNG so the starting layout is the same on every load
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20261108);
const tiltRand = mulberry32(7);   // separate stream so tilts don't reshuffle the layout

function pick(n, exclude) {
  let i;
  do { i = Math.floor(rand() * n); } while (exclude.includes(i));
  return i;
}

// 7x7 colors for one tile: radial gradient hueFrom (center) -> hueTo (corners),
// plus a gentle linear tilt so opposite ends differ slightly
function tileColors(hueFrom, hueTo, angle) {
  const mid = (GRID - 1) / 2;
  const maxDist = Math.hypot(mid, mid);
  const delta = ((hueTo - hueFrom + 540) % 360) - 180;
  const dx = Math.cos(angle), dy = Math.sin(angle);
  const out = [];
  for (let r = 0; r < GRID; r++) {
    for (let c = 0; c < GRID; c++) {
      const t = Math.hypot(r - mid, c - mid) / maxDist;
      const side = ((c - mid) * dx + (r - mid) * dy) / maxDist;
      const hue = (hueFrom + delta * t + SKEW * side + 720) % 360;
      // Tone down glaring yellows with a smooth falloff
      const yw = Math.max(0, 1 - Math.abs(hue - 55) / 35);
      const sat = 92 - 22 * yw;
      const lit = 58 - 10 * yw;
      out.push({ r, c, color: `hsl(${hue} ${sat}% ${lit}%)` });
    }
  }
  return out;
}

/* =========================================================================
   Geometry. Coordinates follow CSS: x right, y DOWN, z toward the viewer.
   Cube spans [-1.5, 1.5]^3, each cubie is 1 unit.
   ========================================================================= */
const GAP  = 0.009;                 // gap between tiles (0.3% of the cube edge)
const TILE = (3 - 2 * GAP) / 3;     // tile size
const CELL = TILE / GRID;           // one shape cell

// Each face: outward normal N, in-face column axis A, row axis B
// (derived from the CSS face transforms of the static version)
const FACE_DEFS = {
  front:  { N: [0, 0, 1],  A: [1, 0, 0],  B: [0, 1, 0]  },
  back:   { N: [0, 0, -1], A: [-1, 0, 0], B: [0, 1, 0]  },
  right:  { N: [1, 0, 0],  A: [0, 0, -1], B: [0, 1, 0]  },
  left:   { N: [-1, 0, 0], A: [0, 0, 1],  B: [0, 1, 0]  },
  top:    { N: [0, -1, 0], A: [1, 0, 0],  B: [0, 0, 1]  },
  bottom: { N: [0, 1, 0],  A: [1, 0, 0],  B: [0, 0, -1] },
};

// --- small 3x3 matrix helpers (row-major arrays of 9) ---
const mul = (a, b) => {
  const m = new Array(9);
  for (let i = 0; i < 3; i++)
    for (let j = 0; j < 3; j++)
      m[i*3+j] = a[i*3]*b[j] + a[i*3+1]*b[3+j] + a[i*3+2]*b[6+j];
  return m;
};
const apply = (m, v) => [
  m[0]*v[0] + m[1]*v[1] + m[2]*v[2],
  m[3]*v[0] + m[4]*v[1] + m[5]*v[2],
  m[6]*v[0] + m[7]*v[1] + m[8]*v[2],
];
const transpose = m => [m[0], m[3], m[6], m[1], m[4], m[7], m[2], m[5], m[8]];
const roundM = m => m.map(x => Math.round(x) + 0);
const roundV = v => v.map(x => Math.round(x) + 0);
function rotX(a) { const c = Math.cos(a), s = Math.sin(a); return [1,0,0, 0,c,-s, 0,s,c]; }
function rotY(a) { const c = Math.cos(a), s = Math.sin(a); return [c,0,s, 0,1,0, -s,0,c]; }
function rotZ(a) { const c = Math.cos(a), s = Math.sin(a); return [c,-s,0, s,c,0, 0,0,1]; }
const rotAxis = (axis, a) => [rotX, rotY, rotZ][axis](a);
const DEG = Math.PI / 180;

// Camera: corner-on isometric view (same as CSS rotateX(-35.264deg) rotateY(45deg))
const VIEW = mul(rotX(-Math.atan(1 / Math.SQRT2)), rotY(45 * DEG));
let O  = [1,0,0, 0,1,0, 0,0,1];      // cube orientation; only phase 6 changes it
let VO = mul(VIEW, O);

/* =========================================================================
   Build stickers: 54 outer (colored shapes) + inner faces (dots)
   ========================================================================= */
const stickers = [];

function buildFace(name) {
  const { N, A, B } = FACE_DEFS[name];
  const colorGrid = [], shapeGrid = [];
  for (let tr = 0; tr < TILES; tr++) {
    colorGrid[tr] = []; shapeGrid[tr] = [];
    for (let tc = 0; tc < TILES; tc++) {
      const nearColors = [], nearShapes = [];
      if (tc > 0) { nearColors.push(colorGrid[tr][tc - 1]); nearShapes.push(shapeGrid[tr][tc - 1]); }
      if (tr > 0) { nearColors.push(colorGrid[tr - 1][tc]); nearShapes.push(shapeGrid[tr - 1][tc]); }
      const ci  = pick(COLORS.length, nearColors);
      const ci2 = pick(COLORS.length, [ci]);
      const si  = pick(SHAPES.length, nearShapes);
      colorGrid[tr][tc] = ci; shapeGrid[tr][tc] = si;
      const angle = tiltRand() * Math.PI * 2;

      // Cubie this tile belongs to, and shape offsets relative to its center
      const P = [0, 1, 2].map(i => N[i] + (tc - 1) * A[i] + (tr - 1) * B[i]);
      const type = SHAPES[si];
      const shapes = tileColors(COLORS[ci].h, COLORS[ci2].h, angle).map(({ r, c, color }) => {
        const lx = -1.5 + tc * (TILE + GAP) + (c + 0.5) * CELL;
        const ly = -1.5 + tr * (TILE + GAP) + (r + 0.5) * CELL;
        return { u: lx - (tc - 1), v: ly - (tr - 1), type, color };
      });
      stickers.push({ P, N: N.slice(), A: A.slice(), B: B.slice(), inner: false, shapes });
    }
  }
}
FACES.forEach(buildFace);

// Inner faces: every cubie face that touches another cubie gets a dot grid
const innerShapes = [];
for (let r = 0; r < GRID; r++)
  for (let c = 0; c < GRID; c++)
    innerShapes.push({ u: (c - 3) * CELL, v: (r - 3) * CELL, type: "dot", color: INNER_COLOR });

for (let x = -1; x <= 1; x++)
  for (let y = -1; y <= 1; y++)
    for (let z = -1; z <= 1; z++)
      for (let a = 0; a < 3; a++)
        for (const s of [-1, 1]) {
          const P = [x, y, z];
          if (Math.abs(P[a] + s) > 1) continue;            // that side is the outer surface
          const N = [0, 0, 0]; N[a] = s;
          const A = [0, 0, 0]; A[(a + 1) % 3] = 1;
          const B = [0, 0, 0]; B[(a + 2) % 3] = 1;
          stickers.push({ P, N, A, B, inner: true, shapes: innerShapes });
        }

/* =========================================================================
   Animation state + phases
   ========================================================================= */
let turnAxis   = -1;          // axis currently turning (-1 = none)
let sliceAngle = [0, 0, 0];   // current angle of slices -1, 0, 1 on turnAxis
let ringAngle  = null;        // [inner, middle, outer] screen angles in phase 6
let nearCorner = [-1, -1, 1]; // cubie at the corner pointing at the viewer

const params = new URLSearchParams(location.search);
const seed = params.has("seed") ? +params.get("seed")
           : params.has("t") ? 1 : (Math.random() * 2 ** 31) | 0;
const moveRand = mulberry32(seed);
const ri = n => Math.floor(moveRand() * n);
const rdir = () => (moveRand() < 0.5 ? -1 : 1);
const ease = t => { t = Math.min(1, Math.max(0, t)); return t < 0.5 ? 4*t*t*t : 1 - (-2*t + 2) ** 3 / 2; };

function resetAnim() { turnAxis = -1; sliceAngle = [0, 0, 0]; ringAngle = null; }

// Snap a finished 90° turn into the stickers' integer coordinates
function bakeLayer(axis, idx, dir) {
  const R = roundM(rotAxis(axis, dir * Math.PI / 2));
  for (const s of stickers) {
    if (s.P[axis] !== idx) continue;
    s.P = roundV(apply(R, s.P)); s.N = roundV(apply(R, s.N));
    s.A = roundV(apply(R, s.A)); s.B = roundV(apply(R, s.B));
  }
}

let prevLayer = null;   // last single-layer turn, so the double turn can avoid it

function phaseSingle(start) {
  const axis = ri(3), idx = ri(3) - 1, dir = rdir();
  prevLayer = { axis, idx };
  return {
    start, duration: TURN_MS,
    apply(t) {
      turnAxis = axis; sliceAngle = [0, 0, 0];
      sliceAngle[idx + 1] = dir * Math.PI / 2 * ease(t / TURN_MS);
    },
    finish() { bakeLayer(axis, idx, dir); resetAnim(); },
  };
}

function phaseDouble(start) {
  const axis = ri(3);
  const pairs = [[-1, 0], [-1, 1], [0, 1]].filter(
    p => !(prevLayer && prevLayer.axis === axis && p.includes(prevLayer.idx)));
  const pair = pairs[ri(pairs.length)];
  const d0 = rdir();
  // Touching layers (one is the middle) must spin in opposite directions;
  // the two outer layers pick independently
  const touching = Math.abs(pair[0] - pair[1]) === 1;
  const dirs = [d0, touching ? -d0 : rdir()];
  return {
    start, duration: TURN_MS,
    apply(t) {
      turnAxis = axis; sliceAngle = [0, 0, 0];
      const e = ease(t / TURN_MS);
      pair.forEach((idx, k) => { sliceAngle[idx + 1] = dirs[k] * Math.PI / 2 * e; });
    },
    finish() { pair.forEach((idx, k) => bakeLayer(axis, idx, dirs[k])); resetAnim(); },
  };
}

function phaseWave(start) {
  const mode = ["LR", "RL", "TB", "BT"][ri(4)];
  // Most vertical cube axis on screen = top/bottom slices; the other two run diagonally
  const yOf = i => VO[3 + i], xOf = i => VO[i];
  const vert = [0, 1, 2].reduce((b, i) => (Math.abs(yOf(i)) > Math.abs(yOf(b)) ? i : b), 0);
  let axis, key;
  if (mode === "TB" || mode === "BT") { axis = vert; key = idx => idx * yOf(axis); }
  else {
    const others = [0, 1, 2].filter(i => i !== vert);
    axis = others[ri(2)]; key = idx => idx * xOf(axis);
  }
  const order = [-1, 0, 1].sort((a, b) => key(a) - key(b));   // left->right / top->bottom
  if (mode === "RL" || mode === "BT") order.reverse();
  const dir = rdir();
  return {
    start, duration: TURN_MS + 2 * WAVE_STAGGER,
    apply(t) {
      turnAxis = axis; sliceAngle = [0, 0, 0];
      order.forEach((idx, k) => {
        sliceAngle[idx + 1] = dir * Math.PI / 2 * ease((t - k * WAVE_STAGGER) / TURN_MS);
      });
    },
    finish() { order.forEach(idx => bakeLayer(axis, idx, dir)); resetAnim(); },
  };
}

// Ring of a cubie = Chebyshev distance from the near-corner cubie (0, 1, 2)
const ringOf = P => Math.max(...P.map((p, i) => Math.abs(p - nearCorner[i])));

function phaseHex(start) {
  // Screen y points down, so a negative angle is counterclockwise on screen
  const target = [-HEX_ANGLE * DEG, HEX_ANGLE * DEG, -HEX_ANGLE * DEG];
  return {
    start, duration: TURN_MS,
    apply(t) { resetAnim(); const e = ease(t / TURN_MS); ringAngle = target.map(a => a * e); },
    finish() {
      // A 120° turn about the view axis (the cube's diagonal through the top
      // corner) is a true cube symmetry, so the cube stays upright with its
      // top corner in the middle. Snap each ring's cubies to their new slots.
      const VOt = transpose(VO);
      const S = target.map(a => roundM(mul(VOt, mul(rotZ(a), VO))));
      const rings = stickers.map(s => ringOf(s.P));
      stickers.forEach((s, i) => {
        const R = S[rings[i]];
        s.P = roundV(apply(R, s.P)); s.N = roundV(apply(R, s.N));
        s.A = roundV(apply(R, s.A)); s.B = roundV(apply(R, s.B));
      });
      resetAnim();
    },
  };
}

function updateNearCorner() {
  let best = -Infinity;
  for (const x of [-1, 1]) for (const y of [-1, 1]) for (const z of [-1, 1]) {
    const d = apply(VO, [x, y, z])[2];
    if (d > best) { best = d; nearCorner = [x, y, z]; }
  }
}
updateNearCorner();

const PHASES = [phaseSingle, phaseDouble, phaseWave, phaseSingle, phaseDouble, phaseHex];
let phaseCount = 0, nextStart = PHASE_PAUSE, current = null;

// Advance the timeline to `elapsed` ms (handles big jumps, e.g. a hidden tab)
function update(elapsed) {
  for (;;) {
    if (current && elapsed >= current.start + current.duration) {
      current.finish();
      nextStart = current.start + current.duration + PHASE_PAUSE;
      current = null;
    }
    if (!current && elapsed >= nextStart) {
      current = PHASES[phaseCount % PHASES.length](nextStart);
      phaseCount++;
      continue;
    }
    break;
  }
  if (current) current.apply(elapsed - current.start);
}

/* =========================================================================
   Rendering
   ========================================================================= */
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
let W = 0, H = 0, unitPx = 0;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  unitPx = Math.min(0.7 * Math.min(W, H), 440) / 3;
}

const TAU = Math.PI * 2;
function shapePath(type, x, y, w) {
  const h = (w * HOLE) / 2;
  switch (type) {
    case "circle": case "dot":
      ctx.arc(x, y, w / 2, 0, TAU); break;
    case "square":
      ctx.roundRect(x - w / 2, y - w / 2, w, w, w * CORNER); break;
    case "ring":
      ctx.arc(x, y, w / 2, 0, TAU);
      ctx.moveTo(x + h, y); ctx.arc(x, y, h, 0, TAU); break;
    case "hollow":
      ctx.roundRect(x - w / 2, y - w / 2, w, w, w * CORNER);
      ctx.moveTo(x + h, y); ctx.arc(x, y, h, 0, TAU); break;
    case "triangle": {
      // Rounded triangle in a w x w box (same proportions as the old SVG mask)
      const px = X => x + (X / 100 - 0.5) * w, py = Y => y + (Y / 100 - 0.5) * w;
      const r = w * 0.09;
      ctx.moveTo(px(50), py(92));
      ctx.arcTo(px(4),  py(92), px(50), py(6),  r);
      ctx.arcTo(px(50), py(6),  px(96), py(92), r);
      ctx.arcTo(px(96), py(92), px(4),  py(92), r);
      ctx.closePath(); break;
    }
  }
}

const SIZE_OF = { circle: SHAPE_SIZE, square: SHAPE_SIZE, ring: SHAPE_SIZE, hollow: SHAPE_SIZE,
                  triangle: TRI_SIZE, dot: DOT_SIZE };

function render() {
  ctx.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2;

  // One matrix per slice of the turning axis (or ring in phase 6)
  const sliceM = [-1, 0, 1].map(i =>
    turnAxis >= 0 && sliceAngle[i + 1] !== 0 ? mul(VO, rotAxis(turnAxis, sliceAngle[i + 1])) : VO);
  const sliding = ringAngle !== null;   // phase 6: positions are slid afterwards

  // During a layer turn the cube is drawn as 3 solid slices along the turn
  // axis. Slices are always separated by planes perpendicular to that axis,
  // so drawing them far-to-near (white body first, then its shapes) hides
  // everything behind a turning layer, like a real cube.
  const blocks = { "-1": [], "0": [], "1": [] };
  const items = [];
  for (const s of stickers) {
    if (s.inner) {
      // Inner faces show only in the gap between two slices at different angles
      if (turnAxis < 0) continue;
      const a = s.N.findIndex(n => n !== 0);
      if (a !== turnAxis) continue;
      const i1 = s.P[a], i2 = s.P[a] + s.N[a];
      if (Math.abs(sliceAngle[i1 + 1] - sliceAngle[i2 + 1]) < 1e-4) continue;
    }
    const M = turnAxis >= 0 ? sliceM[s.P[turnAxis] + 1] : VO;

    const nz = apply(M, s.N)[2];
    const f = Math.min(1, nz / 0.3);            // fade stickers turning edge-on
    if (f <= 0) continue;

    const base = apply(M, [0, 1, 2].map(i => s.P[i] + 0.5 * s.N[i]));
    const MA = apply(M, s.A), MB = apply(M, s.B);
    const scale = unitPx * CELL * (0.5 + 0.5 * f);
    const list = turnAxis >= 0 ? blocks[s.P[turnAxis]] : items;
    const ring = sliding ? ringOf(s.P) : -1;
    for (const sh of s.shapes) {
      list.push({ ring,
        x: cx + (base[0] + sh.u * MA[0] + sh.v * MB[0]) * unitPx,
        y: cy + (base[1] + sh.u * MA[1] + sh.v * MB[1]) * unitPx,
        z: base[2] + sh.u * MA[2] + sh.v * MB[2],
        w: SIZE_OF[sh.type] * scale, type: sh.type, color: sh.color, f,
      });
    }
  }

  if (sliding) { drawItems(hexSlide(items, cx, cy)); return; }
  if (turnAxis < 0) { drawItems(items); return; }

  // Far-to-near slice order along the turn axis
  const order = VO[6 + turnAxis] > 0 ? [-1, 0, 1] : [1, 0, -1];
  for (const i of order) {
    // White body of this slice: hull of its 8 box corners
    const M = sliceM[i + 1];
    const pts = [];
    for (const a of [-1, 1]) for (const b of [-1, 1]) for (const c of [-1, 1]) {
      const v = [a * 1.5, b * 1.5, c * 1.5];
      v[turnAxis] = i + 0.5 * [a, b, c][turnAxis];   // slab [i-0.5, i+0.5] on the turn axis
      const p = apply(M, v);
      pts.push([cx + p[0] * unitPx, cy + p[1] * unitPx]);
    }
    const hull = convexHull(pts);
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    hull.forEach(([x, y], k) => (k ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    ctx.closePath();
    ctx.fill();
    drawItems(blocks[i]);
  }
}

function drawItems(list) {
  list.sort((p, q) => p.z - q.z);               // far to near
  for (const it of list) {
    ctx.globalAlpha = it.f;
    ctx.fillStyle = it.color;
    ctx.beginPath();
    shapePath(it.type, it.x, it.y, it.w);
    ctx.fill("evenodd");
  }
  ctx.globalAlpha = 1;
}

/* Phase 6: hexagonal slide. Instead of a circular rotation (which pushes a
   ring's corners into its neighbors), every shape travels along its own
   hexagonal track around the center:
   - its "hex radius" h (which concentric hexagon it sits on) never changes,
     so each ring stays inside its own hexagonal band and can't touch another
     ring's shapes;
   - it moves along that hexagon at a steady pace, sliding along each edge and
     turning at the corners.
   Two edges of travel = 120°, which lands every shape exactly where a 120°
   rotation would, so the end-of-phase bake is unchanged. */

// Unit hexagon = the cube's silhouette relative to the center, vertices in
// ascending screen angle (y points down, so ascending = clockwise on screen)
function hexVertices() {
  const pts = [];
  for (const x of [-1.5, 1.5]) for (const y of [-1.5, 1.5]) for (const z of [-1.5, 1.5]) {
    const p = apply(VO, [x, y, z]);
    if (Math.hypot(p[0], p[1]) < 1e-6) continue;          // near/far corner sit at the center
    pts.push([p[0], p[1]]);
  }
  return pts.sort((a, b) => Math.atan2(a[1], a[0]) - Math.atan2(b[1], b[0]));
}

// Slide a point (relative to the center) `edges` hexagon edges along its track
function slideOnHex(V, px, py, edges) {
  if (Math.hypot(px, py) < 1e-9) return [px, py];
  for (let j = 0; j < 6; j++) {
    const [ax, ay] = V[j], [bx, by] = V[(j + 1) % 6];
    // Solve p = a*Vj + b*Vj+1 ; inside this sector when a, b >= 0
    const det = ax * by - ay * bx;
    const a = (px * by - py * bx) / det;
    const b = (ax * py - ay * px) / det;
    if (a < -1e-9 || b < -1e-9) continue;
    const h = a + b;                                       // hex radius
    let t = j + b / h + edges;                             // position along the perimeter
    t = ((t % 6) + 6) % 6;
    const k = Math.floor(t), lam = t - k;
    const [cx1, cy1] = V[k], [cx2, cy2] = V[(k + 1) % 6];
    return [h * ((1 - lam) * cx1 + lam * cx2), h * ((1 - lam) * cy1 + lam * cy2)];
  }
  return [px, py];
}

function hexSlide(items, cx, cy) {
  const V = hexVertices();
  for (const it of items) {
    const edges = ringAngle[it.ring] / (60 * DEG);         // 60° of turn = one edge
    const [x, y] = slideOnHex(V, (it.x - cx) / unitPx, (it.y - cy) / unitPx, edges);
    it.x = cx + x * unitPx; it.y = cy + y * unitPx;
  }
  return items;
}

// Monotone-chain convex hull of 2D points
function convexHull(pts) {
  pts = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lower = [], upper = [];
  for (const p of pts) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
    lower.push(p);
  }
  for (let i = pts.length - 1; i >= 0; i--) {
    const p = pts[i];
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
    upper.push(p);
  }
  return lower.slice(0, -1).concat(upper.slice(0, -1));
}

/* =========================================================================
   Run. Debug: ?still (no animation), ?t=<ms> (render one moment), ?seed=<n>
   ========================================================================= */
resize();
if (params.has("still")) {
  render();
  window.addEventListener("resize", () => { resize(); render(); });
} else if (params.has("t")) {
  update(+params.get("t"));
  render();
  window.addEventListener("resize", () => { resize(); render(); });
} else {
  window.addEventListener("resize", resize);
  let t0 = null;
  const frame = now => {
    if (t0 === null) t0 = now;
    update(now - t0);
    render();
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
